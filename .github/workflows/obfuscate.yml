name: Obfuscate JS in-place

on:
  push:
    branches:
      - source
    paths:
      - index.html

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install obfuscator
        run: npm install -g javascript-obfuscator

      - name: Extract and obfuscate JS
        run: |
          node --input-type=module << 'NODEOF'
          import fs from 'fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const m = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!m) process.exit(1);
          fs.writeFileSync('_raw.js', m[1]);
          NODEOF
          javascript-obfuscator _raw.js --output _obf.js --compact true --control-flow-flattening true --string-array true --string-array-encoding base64 --self-defending false
          node --input-type=module << 'NODEOF'
          import fs from 'fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const obf = fs.readFileSync('_obf.js', 'utf8');
          const result = html.replace(/<script>([\s\S]*?)<\/script>/, '<script>' + obf + '<\/script>');
          if (!result.includes('<script>')) process.exit(1);
          fs.writeFileSync('index_obf.html', result);
          console.log('OK size=' + result.length);
          NODEOF
          rm -f _raw.js _obf.js

      - name: Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          cp index_obf.html index.html
          rm -f index_obf.html
          git add index.html
          git diff --cached --quiet || git commit -m "chore: apply JS obfuscation [skip ci]"
          git push origin main
