name: Obfuscate JS in-place

on:
  push:
      branches:
            - source
                paths:
                      - 'index.html'

                      jobs:
                        obfuscate:
                            runs-on: ubuntu-latest
                                permissions:
                                      contents: write

                                          steps:
                                                - name: Checkout source branch
                                                        uses: actions/checkout@v4
                                                                with:
                                                                          ref: source
                                                                                    fetch-depth: 0

                                                                                          - name: Setup Node.js
                                                                                                  uses: actions/setup-node@v4
                                                                                                          with:
                                                                                                                    node-version: '20'
                                                                                                                    
                                                                                                                          - name: Install javascript-obfuscator
                                                                                                                                  run: npm install -g javascript-obfuscator
                                                                                                                                  
                                                                                                                                        - name: Obfuscate JS and write to main
                                                                                                                                                run: |
                                                                                                                                                          # Save obfuscated version to a temp file
                                                                                                                                                                    node -e "
                                                                                                                                                                              const fs = require('fs');
                                                                                                                                                                                        const html = fs.readFileSync('index.html', 'utf8');
                                                                                                                                                                                                  const match = html.match(/<script>([\s\S]*?)<\/script>/);
                                                                                                                                                                                                            if (!match) { console.error('No inline script found'); process.exit(1); }
                                                                                                                                                                                                                      fs.writeFileSync('_raw.js', match[1]);
                                                                                                                                                                                                                                console.log('JS extracted, length: ' + match[1].length);
                                                                                                                                                                                                                                          "
                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                    javascript-obfuscator _raw.js \
                                                                                                                                                                                                                                                                --output _obf.js \
                                                                                                                                                                                                                                                                            --compact true \
                                                                                                                                                                                                                                                                                        --control-flow-flattening true \
                                                                                                                                                                                                                                                                                                    --control-flow-flattening-threshold 0.5 \
                                                                                                                                                                                                                                                                                                                --string-array true \
                                                                                                                                                                                                                                                                                                                            --string-array-encoding 'base64' \
                                                                                                                                                                                                                                                                                                                                        --string-array-threshold 0.75 \
                                                                                                                                                                                                                                                                                                                                                    --self-defending false
                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                              node -e "
                                                                                                                                                                                                                                                                                                                                                                        const fs = require('fs');
                                                                                                                                                                                                                                                                                                                                                                                  let html = fs.readFileSync('index.html', 'utf8');
                                                                                                                                                                                                                                                                                                                                                                                            const obf = fs.readFileSync('_obf.js', 'utf8');
                                                                                                                                                                                                                                                                                                                                                                                                      const result = html.replace(/<script>([\s\S]*?)<\/script>/, '<script>' + obf + '<\/script>');
                                                                                                                                                                                                                                                                                                                                                                                                                fs.writeFileSync('index_obf.html', result);
                                                                                                                                                                                                                                                                                                                                                                                                                          const check = fs.readFileSync('index_obf.html','utf8');
                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!check.includes('<script>') || check.length < html.length) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                console.error('SAFETY CHECK FAILED');
                                                                                                                                                                                                                                                                                                                                                                                                                                                            process.exit(1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                console.log('Safety check OK. Original: ' + html.length + ' Obfuscated: ' + check.length);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    rm -f _raw.js _obf.js
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Checkout main and apply obfuscated file
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            git config user.name "github-actions[bot]"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      git config user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                git checkout main
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          cp index_obf.html index.html
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    rm -f index_obf.html
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              git add index.html
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        git diff --cached --quiet || git commit -m "chore: apply JS obfuscation [skip ci]"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  git push origin main
